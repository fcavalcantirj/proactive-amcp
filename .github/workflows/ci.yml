name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-check)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package structure
        run: |
          npm pack --dry-run 2>&1 | tee pack-output.txt
          # Verify key directories are included
          grep -q 'dist/index.js' pack-output.txt
          grep -q 'dist/index.d.ts' pack-output.txt
          grep -q 'scripts/proactive-amcp.sh' pack-output.txt
          grep -q 'skill/SKILL.md' pack-output.txt
          grep -q 'openclaw.plugin.json' pack-output.txt
          echo "Package structure verified"

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash script syntax
        run: |
          failed=0
          for script in scripts/*.sh; do
            if ! bash -n "$script" 2>&1; then
              echo "FAIL: $script"
              failed=1
            fi
          done
          exit $failed

  bats-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: bats test/
